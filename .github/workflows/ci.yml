# Runs on every pull request and on main (US-001, ADR-012, testing strategy section 5).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Java, JUnit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: beatmind
          POSTGRES_PASSWORD: beatmind
          POSTGRES_DB: beatmind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beatmind" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        working-directory: api
        run: mvn -B verify
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/beatmind_test

  workers:
    name: Workers (Python, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: beatmind
          POSTGRES_PASSWORD: beatmind
          POSTGRES_DB: beatmind_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U beatmind" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: workers
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: workers
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        working-directory: workers
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://beatmind:beatmind@localhost:5432/beatmind_test

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Type check and build
        working-directory: web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  infra:
    name: Infrastructure (OpenTofu validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - run: tofu fmt -recursive -check infra
      - name: Validate environments
        run: |
          for env in staging production; do
            (cd infra/envs/$env && tofu init -backend=false -input=false && tofu validate)
          done

  traceability:
    name: RTM check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_rtm.py

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  stack:
    name: Local stack smoke test (Docker Compose)
    runs-on: ubuntu-latest
    needs: [api, workers, web]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait postgres api s3
      - name: Start the stub worker
        run: docker compose up -d --build worker
      - name: API answers
        run: |
          for i in $(seq 1 30); do
            curl -fsS localhost:8080/actuator/health && break
            sleep 2
          done
          curl -fsS "localhost:8080/v1/pricing?country=IN" | grep -q '"currency":"INR"'
      - name: A queued job is processed by the stub worker
        run: |
          docker compose exec -T postgres psql -U beatmind -d beatmind -c \
            "INSERT INTO generation_job (id, kind, payload) VALUES ('00000000-0000-0000-0000-000000000001', 'song', '{\"prompt\":\"ci smoke\"}')"
          for i in $(seq 1 30); do
            status=$(docker compose exec -T postgres psql -U beatmind -d beatmind -tAc \
              "SELECT status FROM generation_job WHERE id = '00000000-0000-0000-0000-000000000001'")
            echo "status: $status"
            [ "$status" = "succeeded" ] && exit 0
            sleep 2
          done
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
