[project]
name = "beatmind-workers"
version = "0.1.0"
description = "BeatMind GPU and post-processing workers (ARCH-04, ARCH-05)"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "boto3>=1.35,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6"]

[project.scripts]
beatmind-worker = "beatmind_workers.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["beatmind_workers"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
markers = ["integration: needs PostgreSQL (TEST_DATABASE_URL)"]
