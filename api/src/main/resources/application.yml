spring:
  application:
    name: beatmind-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/beatmind}
    username: ${DATABASE_USER:beatmind}
    password: ${DATABASE_PASSWORD:beatmind}
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

beatmind:
  turnstile:
    # Cloudflare Turnstile secret. Blank disables the bot check (local development only).
    secret: ${TURNSTILE_SECRET:}
