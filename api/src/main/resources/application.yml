spring:
  application:
    name: beatmind-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/beatmind}
    username: ${DATABASE_USER:beatmind}
    password: ${DATABASE_PASSWORD:beatmind}
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # US-021: the verify page takes one audio file.
      max-file-size: 30MB
      max-request-size: 31MB
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      service: beatmind-api
  # US-004: metrics are scraped by Prometheus; traces go to any OTLP collector when an endpoint is
  # set (Jaeger locally, Grafana Cloud or Tempo in staging). Blank endpoint: no trace export.
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:}
  logging:
    export:
      otlp:
        enabled: false

beatmind:
  auth:
    # US-009. See AuthProperties for what each setting does. Release values are in TODO.md.
    pepper: ${BEATMIND_AUTH_PEPPER:}
    dev-codes: ${BEATMIND_AUTH_DEV_CODES:false}
    cookie-secure: ${BEATMIND_AUTH_COOKIE_SECURE:true}
    web-origin: ${BEATMIND_WEB_ORIGIN:http://localhost:3000}
    admin-emails: ${BEATMIND_ADMIN_EMAILS:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
  storage:
    endpoint: ${S3_ENDPOINT:}
    bucket: ${S3_BUCKET:beatmind-audio}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    region: ${S3_REGION:auto}
  cost:
    # REQ-NFR-07: price of the GPU the workers run on, and the per-song ceiling (TDD section 9.1:
    # two takes at up to US$0.006 each at beta utilisation).
    gpu-usd-per-hour: ${GPU_USD_PER_HOUR:0.40}
    ceiling-usd-per-song: ${COST_CEILING_USD_PER_SONG:0.012}
  entitlements:
    # US-030 and US-026. One credit is one take; a song request makes two takes.
    # Free daily credits is only the starting value: admins change it at /admin (REQ-F-55).
    free-daily-credits: ${BEATMIND_FREE_DAILY_CREDITS:20}
    # Paid allowances are placeholders until pricing fixes them (entitlement matrix).
    creator-monthly-credits: ${BEATMIND_CREATOR_MONTHLY_CREDITS:600}
    pro-monthly-credits: ${BEATMIND_PRO_MONTHLY_CREDITS:2000}
    user-requests-per-ten-minutes: ${BEATMIND_USER_REQUESTS_PER_10_MINUTES:6}
    ip-requests-per-hour: ${BEATMIND_IP_REQUESTS_PER_HOUR:60}
    day-zone: Asia/Kolkata
    download-link-ttl: 15m
    # Key that signs download links. Set in staging and production (TODO.md).
    download-secret: ${BEATMIND_DOWNLOAD_SECRET:}
    # US-018: lyric drafts per account per day. US-025: free commercial licences per month (A-005).
    lyrics-per-day: ${BEATMIND_LYRICS_PER_DAY:30}
    free-commercial-licences-per-month: 5
  billing:
    # US-034. mode: stub (local; checkout is simulated through the real webhook handler), test or
    # live (Razorpay). Keys and plan ids come from the Razorpay dashboard (TODO.md).
    mode: ${BEATMIND_BILLING_MODE:stub}
    razorpay:
      api-url: ${RAZORPAY_API_URL:https://api.razorpay.com}
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      # Razorpay plan ids per plan and price variant, for example "creator-A=plan_Nx..,pro-A=plan_Ny..".
      plans: ${RAZORPAY_PLANS:}
  fallback:
    # US-016, ADR-007: paid songs go to the Lyria API when the GPU queue is too long, or always for
    # the languages listed, until the daily spend cap is reached. Off until the API is set up.
    enabled: ${BEATMIND_FALLBACK_ENABLED:false}
    after-wait-seconds: ${BEATMIND_FALLBACK_AFTER_SECONDS:120}
    languages: ${BEATMIND_FALLBACK_LANGUAGES:}
    usd-per-take: ${BEATMIND_FALLBACK_USD_PER_TAKE:0.04}
    daily-cap-usd: ${BEATMIND_FALLBACK_DAILY_CAP_USD:10}
  verify:
    # US-021, REQ-SEC-10: checks per network per hour, and the largest file accepted.
    per-ip-per-hour: ${BEATMIND_VERIFY_PER_IP_PER_HOUR:20}
    max-file-mb: 30
  turnstile:
    # Cloudflare Turnstile secret. Blank disables the bot check (local development only).
    secret: ${TURNSTILE_SECRET:}
  languages:
    # REQ-F-07: vocal languages that passed listening gate G1 (US-040), comma-separated, for example
    # "hi,hinglish". Every other language is shown as experimental.
    g1-passed: ${BEATMIND_G1_PASSED:}
  retention:
    # TDD 5.2: files of deleted songs are removed this long after deletion.
    deleted-songs: 30d
    purge-every: 1h
