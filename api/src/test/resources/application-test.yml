spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/beatmind_test}
    username: ${TEST_DATABASE_USER:beatmind}
    password: ${TEST_DATABASE_PASSWORD:beatmind}
  flyway:
    clean-disabled: false

beatmind:
  auth:
    pepper: test-pepper
    dev-codes: true
    cookie-secure: false
    admin-emails: admin@example.com
    google:
      client-id: test-client.apps.googleusercontent.com
      client-secret: test-secret
      redirect-uri: http://localhost:3000/v1/auth/google/callback
  generation:
    poll-every: 50ms
    # Tests run the finalizer themselves.
    finalize-every: 1h
  metrics:
    # Tests call refresh() themselves.
    refresh: 1h
  entitlements:
    download-secret: test-download-secret
