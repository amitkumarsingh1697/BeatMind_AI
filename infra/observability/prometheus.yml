# Local Prometheus for US-004 (docker compose --profile observability). Staging uses the same
# scrape target and alert rules with the hosted stack chosen in TODO.md.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: beatmind-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
