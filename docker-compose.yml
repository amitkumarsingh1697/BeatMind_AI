# Local development stack (US-002). Start everything:  docker compose up --build
# Then open http://localhost:3000/en/create to sign in and make a song (Sprint 1).
# Ports: web 3000, API 8080, PostgreSQL 5432, Valkey 6379, S3 (SeaweedFS) 8333.
# Monitoring (US-004):  TRACING_EXPORT_ENABLED=true docker compose --profile observability up --build
#   adds Grafana 3001, Prometheus 9090 and Jaeger 16686.
# Credentials here are for local use only. Real secrets never go in this repository.

services:
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: beatmind
      POSTGRES_PASSWORD: beatmind
      POSTGRES_DB: beatmind
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/dev/create-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beatmind"]
      interval: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.0.7-alpine
    ports: ["6379:6379"]

  s3:
    # S3-compatible object store standing in for Cloudflare R2 (ARCH-08).
    image: chrislusf/seaweedfs:4.51
    command: server -s3 -dir=/data -ip.bind=0.0.0.0
    ports: ["8333:8333"]
    volumes:
      - s3data:/data

  api:
    build: ./api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/beatmind
      DATABASE_USER: beatmind
      DATABASE_PASSWORD: beatmind
      # Sign-in (US-009), local only: codes are shown in the page instead of emailed, and the
      # cookie works over plain http. Sign in as this email to see the failed-jobs page.
      BEATMIND_AUTH_DEV_CODES: "true"
      BEATMIND_AUTH_COOKIE_SECURE: "false"
      BEATMIND_AUTH_PEPPER: local-only-pepper
      BEATMIND_ADMIN_EMAILS: ${BEATMIND_ADMIN_EMAILS:-admin@example.com}
      # Every local request comes from the web container's address, so the per-IP limit is raised.
      BEATMIND_AUTH_MAX_CODES_PER_IP_PER_HOUR: "1000"
      # Same reason for the per-network song limit (US-030).
      BEATMIND_IP_REQUESTS_PER_HOUR: "1000"
      # Signs 15-minute download links (US-026). Local only; staging and production get a secret.
      BEATMIND_DOWNLOAD_SECRET: local-only-download-secret
      BEATMIND_WEB_ORIGIN: http://localhost:3000
      # Languages that passed listening gate G1 (REQ-F-07); the rest show as experimental.
      BEATMIND_G1_PASSED: ${BEATMIND_G1_PASSED:-}
      # Google sign-in stays off unless you set these (see TODO.md, Sprint 1).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/v1/auth/google/callback}
      # Take audio is read from the same store the worker writes to.
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: local
      S3_SECRET_KEY: local-secret
      S3_REGION: us-east-1
      S3_BUCKET: beatmind-audio
      # Monitoring (US-004): JSON logs with trace ids; traces go to Jaeger when exporting is on.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      TRACING_EXPORT_ENABLED: ${TRACING_EXPORT_ENABLED:-false}
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    # CPU stub runner by default: writes short tones instead of music, so no GPU is needed.
    # For real songs, run ACE-Step on a GPU box (or natively on a Mac, see the README) and start with
    #   BEATMIND_RUNNER=acestep ACESTEP_URL=http://<gpu-box>:8001 docker compose up
    build: ./workers
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://beatmind:beatmind@postgres:5432/beatmind
      BEATMIND_RUNNER: ${BEATMIND_RUNNER:-stub}
      ACESTEP_URL: ${ACESTEP_URL:-}
      ACESTEP_API_KEY: ${ACESTEP_API_KEY:-}
      # Seconds to wait for one request's takes, and before a running job counts as stuck.
      # Raise both for a laptop or CPU, where two takes can take several minutes.
      ACESTEP_TIMEOUT_SECONDS: ${ACESTEP_TIMEOUT_SECONDS:-600}
      BEATMIND_LEASE_SECONDS: ${BEATMIND_LEASE_SECONDS:-600}
      S3_ENDPOINT: http://s3:8333
      S3_ACCESS_KEY: local
      S3_SECRET_KEY: local-secret
      S3_REGION: us-east-1
      S3_BUCKET: beatmind-audio
      S3_CREATE_BUCKET: "true"
      # Every take gets a watermark, AI-label tags and a C2PA manifest (REQ-F-30). Without
      # C2PA_SIGN_CERT and C2PA_SIGN_KEY the worker signs with a throwaway development certificate.
      BEATMIND_FINISHING: "on"
      # AI lyric writer (US-018): "stub" templates locally, "llm" with LYRICS_LLM_URL and
      # LYRICS_LLM_MODEL pointing at an OpenAI-compatible server (TODO.md, Sprint 3).
      BEATMIND_LYRICS_WRITER: ${BEATMIND_LYRICS_WRITER:-stub}
      LYRICS_LLM_URL: ${LYRICS_LLM_URL:-}
      LYRICS_LLM_MODEL: ${LYRICS_LLM_MODEL:-}
      # Similarity screen (US-029). The reference index is empty until a catalogue is loaded.
      BEATMIND_SIMILARITY: ${BEATMIND_SIMILARITY:-on}
    depends_on:
      api:
        condition: service_started
      s3:
        condition: service_started
    restart: on-failure

  web:
    build: ./web
    environment:
      API_ORIGIN: http://api:8080
    ports: ["3000:3000"]
    depends_on: [api]

  # Monitoring (US-004), only with --profile observability.
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.13.5
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
    depends_on: [api]

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.21.0
    ports: ["16686:16686", "4318:4318"]

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.0.12
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/beatmind-pipeline.json
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus, jaeger]

volumes:
  pgdata:
  s3data:
